# Alembic: schema migrations of the application tables (src/data/db.py).
#
# The database URL is not stored here: env.py takes DATABASE_URL from config/settings.py
# (an environment variable wins over .env). Jobs never migrate - db.init_db only checks the
# schema version - so migrations are run by hand (docs/operations.md, "Schema migrations").

[alembic]
script_location = %(here)s/src/data/migrations
prepend_sys_path = %(here)s
path_separator = os
# New revisions: alembic revision --rev-id 0002 -m "what changes" -> 0002_what_changes.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
