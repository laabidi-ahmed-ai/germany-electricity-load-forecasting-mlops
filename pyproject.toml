[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "germany-electricity-load-forecasting-mlops"
version = "0.1.0"
description = "End-to-end MLOps system forecasting Germany's day-ahead hourly electricity load (DE_LU)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmed Laabidi" }]
keywords = ["mlops", "forecasting", "time-series", "electricity", "germany"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Core runtime stack — see README §10 "Tech stack".
dependencies = [
    # Data pull
    "requests>=2.31",
    # Data handling
    # <3: Evidently (drift) cannot import under pandas 3 yet; jobs install fresh on every
    # run, so an unbounded floor let a new major break the drift check (README §16.2).
    "pandas>=2.1,<3",
    # <2.5: pandas 2.x predates NumPy 2.5 and triggers its new timedelta deprecation
    # (NumPy 2.5 needs Python >= 3.12, so it broke CI's 3.12 job only). Lift with pandas 3.
    "numpy>=1.26,<2.5",
    "pyarrow>=14",
    "holidays>=0.40",
    # Storage (Postgres; SQLite for local dev)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # Schema migrations (src/data/migrations). Jobs never import it: init_db only reads the
    # schema version, so the lean ingest and dashboard installs do without it.
    "alembic>=1.13",
    # Config / secrets
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    # Modeling
    "lightgbm>=4.1",
    # Experiment tracking + registry
    "mlflow>=3.0",
    # Serving
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    # Monitoring / drift
    "evidently>=0.7",
    # Dashboard
    "streamlit>=1.49",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",          # FastAPI TestClient
    "pyyaml>=6.0",          # workflow-contract tests
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/laabidi-ahmed-ai/germany-electricity-load-forecasting-mlops"

# --------------------------------------------------------------------------- #
# setuptools: which top-level packages ship in the wheel
# --------------------------------------------------------------------------- #
[tool.setuptools.packages.find]
include = ["src*", "config*", "dashboard*"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: tests that need network or a live database (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "error::DeprecationWarning:src",
]

# --------------------------------------------------------------------------- #
# ruff (lint + format)
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "notebooks",              # exploration only, never the source of truth
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "N803",  # `X` (feature matrix) is the ML/scikit-learn convention ...
    "N806",  # ... and so are X_train / X_val locals
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `param: T = Depends(...)` / `Query(...)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config", "dashboard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
