# Daily monitoring + drift-triggered retraining (README §9 / §15 Phase 5-6).
#
# Scores yesterday's forecasts against the actuals and the official forecast, runs the
# Evidently drift check, and - only if a trigger fires - trains a challenger and promotes
# it if it beats the champion by the configured margin. Every decision is written to
# the monitoring_events table and to MLflow (backend store = the cloud Postgres, so the
# lineage survives the ephemeral runner; the promoted model is exported to the DB).
name: monitor-retrain

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily, after the forecast job
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = retrain only if triggered; check-only = never retrain; force = retrain now"
        type: choice
        options: [auto, check-only, force]
        default: auto
      dry_run:
        description: "evaluate the challenger but never register / promote"
        type: boolean
        default: false

concurrency:
  group: monitor-retrain
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # MLflow lineage lives in Postgres too; a dedicated store can be given via MLFLOW_TRACKING_URI.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || secrets.DATABASE_URL }}
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Refresh actuals + official forecast + weather
        run: python -m src.data.ingest --sources smard,weather,entsoe

      - name: Monitor / retrain
        run: |
          FLAGS=""
          case "${{ inputs.mode || 'auto' }}" in
            check-only) FLAGS="--check-only" ;;
            force)      FLAGS="--force" ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          python -m src.monitoring.retrain $FLAGS

      - name: Champion after this run
        if: always()
        run: python -m src.models.registry --show
