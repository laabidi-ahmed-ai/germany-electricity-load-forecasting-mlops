# Daily day-ahead forecast: champion model (from the DB export) -> load_forecast_model.
# Refreshes actuals itself so it never forecasts on stale data. README §3 / §14 / §16.
#
# Started on time at 05:40 UTC by an external scheduler calling workflow_dispatch
# (docs/operations.md): GitHub's own cron ran this job 5-8 h late every day. The cron
# below stays as a backup; --once-per-day turns it into a no-op once today's forecast
# exists. monitor-retrain starts when this workflow completes.
name: forecast

on:
  schedule:
    - cron: "40 5 * * *" # backup for the external 05:40 UTC trigger
  workflow_dispatch:
    inputs:
      hours:
        description: "hours to forecast after the latest actual (1-24)"
        required: false
        default: "24"
      force:
        description: "forecast again even if today's forecast was already issued"
        type: boolean
        default: false

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python + dependencies
        uses: ./.github/actions/setup

      - name: Refresh actuals + weather (incremental ingest)
        run: python -m src.data.ingest

      - name: Show champion
        run: python -m src.models.registry --show

      - name: Day-ahead forecast -> database
        run: |
          FLAGS="--once-per-day"
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS=""; fi
          python -m src.serving.batch_forecast --hours "${{ inputs.hours || '24' }}" $FLAGS
