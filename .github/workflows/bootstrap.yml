# One-time seeding of the cloud stack (run manually once, after adding the secrets):
#   backfill 2021-03-01 -> now  ->  features  ->  train + CV (MLflow on Postgres)
#   -> register + promote champion (exported to the DB)  ->  first day-ahead forecast
#   -> monitoring check.
# Re-running is safe: every step is idempotent (upserts) or creates a new model version.
#
# Evaluate another horizon without touching production: skip_backfill, horizon=d_plus_1,
# promote=false -> CV report + a 365-day backtest vs the official forecast in the log and
# MLflow, nothing registered. Switch to it: the same with promote=true (docs/operations.md).
name: bootstrap

on:
  workflow_dispatch:
    inputs:
      start:
        description: "backfill start date YYYY-MM-DD"
        required: false
        default: "2021-03-01"
      skip_backfill:
        description: "skip the data backfill (data already in the DB)"
        type: boolean
        default: false
      skip_training:
        description: "skip training (a champion is already exported)"
        type: boolean
        default: false
      horizon:
        description: "day_ahead = 24 h after the latest actual; d_plus_1 = next calendar day (Berlin)"
        type: choice
        options: [day_ahead, d_plus_1]
        default: day_ahead
      promote:
        description: "register + promote the trained model and forecast with it (off = evaluate only)"
        type: boolean
        default: true

concurrency:
  group: bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python + dependencies
        uses: ./.github/actions/setup

      - name: Backfill history (SMARD load + official forecast, Open-Meteo weather)
        if: ${{ !inputs.skip_backfill }}
        run: python -m src.data.ingest --backfill --start "${{ inputs.start }}"

      - name: Build feature frame
        if: ${{ !inputs.skip_training }}
        run: python -m src.features.build_features

      - name: Train + expanding-window CV (baselines vs LightGBM) -> MLflow
        if: ${{ !inputs.skip_training }}
        run: python -m src.models.train --horizon "${{ inputs.horizon }}"

      - name: Out-of-sample backtest vs the official forecast (last 365 days)
        if: ${{ !inputs.skip_training && !inputs.promote }}
        run: python -m src.monitoring.performance --backtest-days 365 --horizon "${{ inputs.horizon }}"

      - name: Register + promote champion (exported to the database)
        if: ${{ !inputs.skip_training && inputs.promote }}
        run: python -m src.models.registry --promote-latest

      - name: First forecast with the champion
        if: ${{ inputs.promote }}
        run: python -m src.serving.batch_forecast

      - name: Monitoring check (no retraining)
        if: ${{ inputs.promote }}
        run: python -m src.monitoring.retrain --check-only

      - name: Summary
        if: always()
        run: python -m src.models.registry --show
